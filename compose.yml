# Set these host paths in .env or your Compose stack environment.
x-media-volumes: &app-volumes
  - "${INGEST_PATH:?Set INGEST_PATH to the import directory}:/ingest:rw"
  - "${MOVIES_PATH:?Set MOVIES_PATH to the movie output directory}:/output/movies:rw"
  - "${TELEVISION_PATH:?Set TELEVISION_PATH to the episode output directory}:/output/television:rw"
  - "${APP_DATA_PATH:-./data}:/data:rw"

services:
  web:
    image: ${INOSCULATE_IMAGE:-inosculate:local}
    build: .
    command: ["web"]
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8787}:8787"
    environment: &app-environment
      INGEST_DIR: /ingest
      MOVIES_DIR: /output/movies
      TELEVISION_DIR: /output/television
      DATA_DIR: /data
      # An approved cleanup is moved here, on the ingest filesystem.
      # Set this to an empty value in an override for permanent deletion.
      TRASH_DIR: /ingest/.inosculate-trash
      REMUX_CONCURRENCY: ${REMUX_CONCURRENCY:-1}
      PROBE_CONCURRENCY: ${PROBE_CONCURRENCY:-3}
      PREVIEW_CONCURRENCY: ${PREVIEW_CONCURRENCY:-2}
      STABILITY_SECONDS: ${STABILITY_SECONDS:-30}
    volumes: *app-volumes

  worker:
    image: ${INOSCULATE_IMAGE:-inosculate:local}
    pull_policy: never
    depends_on: [web]
    command: ["worker"]
    restart: unless-stopped
    environment: *app-environment
    volumes: *app-volumes
